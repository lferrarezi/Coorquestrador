# config/coorq-hitl-gates.yaml
# Gates Human-in-the-loop do Coorquestrador (v1: Gate 1 obrigatorio).

version: 1

gates:

  gate1_plan_quota:
    name: "Aprovacao de Plano e Custo"
    blocking: true            # bloqueia execucao ate aprovacao
    always: true              # sempre dispara, antes de qualquer gasto de credito
    approves:
      - plano de tarefas e DAG
      - matriz de roteamento (engine/modelo/potencia)
      - cota estimada total e por tarefa
      - comandos CLI que serao executados
    on_reject: replanejar     # volta para [2] PLANO / [4] ROTEAMENTO

  gate2_delivery:
    name: "Aprovacao de Entrega"
    blocking: true
    always: false
    triggers:                 # dispara se QUALQUER condicao for verdadeira
      - cota_real_acima_do_teto        # cost-table.quota_gate2_threshold
      - impacto_em_producao
      - dados_sensiveis
      - decisao_irreversivel
      - commit_ou_push
    approves:
      - resultado revisado antes de consolidar/commitar
    on_reject: retrabalho     # retorna a tarefa ao engine ou troca de engine

escalation:
  no_engine_available: "Marcar tarefa como bloqueada e escalar no Gate 1 com o motivo do probe."
  credit_below_threshold: "Excluir engine do roteamento e propor alternativa no Gate 1."
  quota_overrun_runtime: "Pausar execucao e reabrir Gate 1 com nova cota."
